name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Build frontend once, share as artifact ──────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Build backend on each platform ─────────────────────────────────────────
  build-backend:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            name: linux-ubuntu20
            exe: Server
            archive_cmd: tar -czf ../../mbquide-${{ github.ref_name }}-linux-ubuntu20.tar.gz Server dist launch.sh
            archive_name: mbquide-${{ github.ref_name }}-linux-ubuntu20.tar.gz

          - os: ubuntu-22.04
            name: linux-ubuntu22
            exe: Server
            archive_cmd: tar -czf ../../mbquide-${{ github.ref_name }}-linux-ubuntu22.tar.gz Server dist launch.sh
            archive_name: mbquide-${{ github.ref_name }}-linux-ubuntu22.tar.gz

          - os: ubuntu-24.04
            name: linux-ubuntu24
            exe: Server
            archive_cmd: tar -czf ../../mbquide-${{ github.ref_name }}-linux-ubuntu24.tar.gz Server dist launch.sh
            archive_name: mbquide-${{ github.ref_name }}-linux-ubuntu24.tar.gz

          - os: ubuntu-26.04
            name: linux-ubuntu26
            exe: Server
            archive_cmd: tar -czf ../../mbquide-${{ github.ref_name }}-linux-ubuntu26.tar.gz Server dist launch.sh
            archive_name: mbquide-${{ github.ref_name }}-linux-ubuntu26.tar.gz

          - os: macos-latest
            name: macos
            exe: Server
            archive_cmd: tar -czf ../../mbquide-${{ github.ref_name }}-macos.tar.gz Server dist launch.sh
            archive_name: mbquide-${{ github.ref_name }}-macos.tar.gz

          - os: windows-latest
            name: windows
            exe: Server.exe
            archive_cmd: 7z a ..\..\mbquide-${{ github.ref_name }}-windows.zip Server.exe dist launch.bat
            archive_name: mbquide-${{ github.ref_name }}-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Platform deps ────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libboost-all-dev libssl-dev libasio-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake ninja boost openssl asio

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja -y
          vcpkg install boost-graph asio openssl --triplet x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # ── Build backend ────────────────────────────────────────────────────────
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -S backend -B backend/build

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DASIO_INCLUDE_DIR="$env:VCPKG_ROOT/installed/x64-windows/include" `
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" `
            -S backend -B backend/build

      - name: Build
        run: cmake --build backend/build --config Release

      # ── Download frontend dist ───────────────────────────────────────────────
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # ── Copy frontend dist to backend build directory ─────────────────────────
      - name: Copy frontend dist to build directory
        working-directory: backend/build
        run: |
          mkdir -p ./frontend/dist
          cp -r ../../frontend/dist/* ./frontend/dist/

      # ── Write launcher scripts ───────────────────────────────────────────────
      - name: Write launcher (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: backend/build
        run: |
          cat > launch.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR"
          echo "Starting server on http://localhost:18080 ..."
          ./Server
          EOF
          chmod +x launch.sh

      - name: Write launcher (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: backend/build
        shell: pwsh
        run: |
          @"
          @echo off
          cd /d "%~dp0"
          echo Starting server on http://localhost:18080 ...
          start http://localhost:18080
          Server.exe
          "@ | Set-Content launch.bat

      # ── Package everything ───────────────────────────────────────────────────
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: backend/build
        run: ${{ matrix.archive_cmd }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: backend/build
        shell: pwsh
        run: ${{ matrix.archive_cmd }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.archive_name }}

  # ── Create GitHub Release and attach all packages ──────────────────────────
  release:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: packages/*